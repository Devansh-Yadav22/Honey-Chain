version: "3.8"

services:
  # ── PostgreSQL Database ──────────────────────
  db:
    image: postgres:16-alpine
    container_name: honeychain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: honeychain
      POSTGRES_PASSWORD: honeychain2026
      POSTGRES_DB: honeychain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeychain -d honeychain"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── AI Service (Python / FastAPI) ────────────
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: honeychain-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Backend (Node.js / Express) ──────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honeychain-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://honeychain:honeychain2026@db:5432/honeychain
      AI_SERVICE_URL: http://ai:8000
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-honey-chain-f3563}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/uploads

  # ── Frontend (React / Vite / Nginx) ──────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: honeychain-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-AIzaSyDNWGE1-3jgQIi0zb56okwNRmMSf3Rmwng}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-honey-chain-f3563.firebaseapp.com}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-honey-chain-f3563}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-honey-chain-f3563.firebasestorage.app}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-201774746282}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-1:201774746282:web:5dac96fd114c44462a1ed3}
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
